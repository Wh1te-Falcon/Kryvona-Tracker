<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kryvona CA Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#03040a;--card:#07090f;--blue:#1f5fff;--lb:#6f9bff;--tx:#f4f6fb;--mute:#8a93b0;--ok:#34d399;--bad:#ff6b6b;--ln:#151b2c;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--tx);font-family:Inter,Calibri,'Segoe UI',Arial,sans-serif;font-size:14.5px;background:
radial-gradient(1px 1px at 20px 40px,rgba(255,255,255,.45),transparent),radial-gradient(1px 1px at 130px 90px,rgba(255,255,255,.28),transparent),radial-gradient(1.2px 1.2px at 210px 170px,rgba(255,255,255,.35),transparent),radial-gradient(1px 1px at 70px 200px,rgba(255,255,255,.22),transparent),var(--bg);background-size:240px 240px,240px 240px,240px 240px,240px 240px,auto}
.wrap{max-width:760px;margin:0 auto;padding:12px 14px 40px}
.top{display:flex;align-items:center;justify-content:space-between;padding:6px 0 14px;border-bottom:1px solid var(--ln)}
.logo{height:32px;mix-blend-mode:screen;display:block}
.me{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);text-align:right}.me button{background:none;border:0;color:var(--lb);font:inherit;letter-spacing:.14em;text-transform:uppercase;cursor:pointer;padding:0;margin-left:10px}
.hero{padding:24px 2px 2px}
.eye{font-size:11px;letter-spacing:.3em;color:var(--mute);text-transform:uppercase}
.hero h1{margin:10px 0 0;font-size:40px;line-height:1.02;font-weight:800;letter-spacing:-.045em}.hero h1 em{font-style:normal;color:var(--blue)}
.ul{height:3px;width:150px;background:var(--blue);border-radius:3px;margin:10px 0 0;box-shadow:0 0 14px rgba(31,95,255,.7)}
.card{background:var(--card);border:1px solid var(--ln);border-radius:20px;padding:16px;margin-bottom:12px}
h2{display:flex;align-items:center;gap:12px;font-size:11px;font-weight:600;letter-spacing:.26em;text-transform:uppercase;margin:0 0 12px}
h2::before{content:"";width:26px;height:2px;background:var(--blue);flex:0 0 26px}
.bar{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0}
.tab{flex:1;min-width:70px;padding:10px 6px;color:var(--mute);background:var(--card);border:1px solid var(--ln);border-radius:999px;font:inherit;font-weight:600;font-size:12px;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;text-align:center}
.tab.on{background:var(--blue);color:#fff;border-color:var(--blue);box-shadow:0 0 22px rgba(31,95,255,.45)}
.tab small{display:block;font-size:10px;font-weight:400;opacity:.85;letter-spacing:.04em;text-transform:none}
.day{min-width:56px;padding:8px 2px}
button,input,select{font-family:inherit}
.wkb{display:flex;gap:8px;align-items:center;justify-content:space-between;color:var(--mute)}
.wkb button{background:var(--card);border:1px solid var(--ln);color:var(--lb);border-radius:999px;padding:6px 14px;cursor:pointer}
.btn{background:var(--blue);border:0;color:#fff;border-radius:999px;padding:12px 22px;font-weight:600;font-size:12px;letter-spacing:.16em;text-transform:uppercase;cursor:pointer;margin-top:12px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stats div{border:1px solid var(--ln);border-radius:14px;padding:10px;text-align:center}.stats b{display:block;font-size:22px;font-weight:800;letter-spacing:-.03em}.stats span{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.prog{height:6px;background:#12172a;border-radius:6px;overflow:hidden;margin:8px 0 2px}.prog i{display:block;height:100%;background:var(--blue);transition:width .25s}
.task{display:flex;gap:12px;align-items:flex-start;padding:11px 0;border-top:1px solid var(--ln);cursor:pointer}.task:first-of-type{border-top:0}
.box{flex:0 0 24px;height:24px;border:2px solid var(--blue);border-radius:8px;display:flex;align-items:center;justify-content:center;color:transparent;font-weight:700}
.task.done .box{background:var(--blue);color:#fff}.task.done .t{color:var(--mute);text-decoration:line-through}.task.lock{opacity:.4;pointer-events:none}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.grid label,.rl{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);display:block;margin-bottom:5px}
input,select{width:100%;padding:11px 12px;border-radius:14px;color:#fff;font-size:15px;background:#0b0e19;border:1px solid var(--ln)}select option{color:#000}
input:focus,select:focus{outline:none;border-color:var(--blue)}input:disabled{opacity:.4}
.scroll{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:520px}
th,td{padding:8px 6px;text-align:center;border-top:1px solid var(--ln);font-size:13px}th{color:var(--mute);font-weight:500;font-size:10px;letter-spacing:.12em;text-transform:uppercase}td:first-child,th:first-child{text-align:left}
.pill{display:inline-block;min-width:44px;padding:3px 8px;border-radius:999px;font-size:12px;font-weight:600;color:#03040a}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.ch{font-size:10px;letter-spacing:.1em;color:var(--mute);text-align:center}
.cell{min-height:56px;border-radius:12px;padding:5px;font-size:11px;cursor:pointer;text-align:left;color:var(--tx);background:var(--card);border:1px solid var(--ln)}
.cell.out{opacity:.3}.cell.we{background:transparent;border-style:dashed;cursor:default}.cell.today{border-color:var(--blue)}.cell.sel{background:#0e1a44}
.cell b{display:block;font-size:12px}.cell small{color:var(--mute);display:block}
.sum{white-space:pre-wrap;line-height:1.55;font-size:14px}
.sc{display:flex;gap:6px}.sc button{flex:1;padding:10px 0;border-radius:12px;border:1px solid var(--ln);background:#0b0e19;color:var(--mute);font-weight:600;cursor:pointer}.sc button.on{background:var(--blue);border-color:var(--blue);color:#fff}
.note{color:var(--mute);font-size:12px;margin-top:10px;line-height:1.5}
.lock .wrap{visibility:hidden}#auth{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(3,4,10,.94);z-index:9}#auth .card{width:100%;max-width:340px}
#auth a{color:var(--lb);font-size:12px;cursor:pointer;display:inline-block;margin-top:12px}
@media(max-width:480px){.hero h1{font-size:34px}}
</style></head><body><div class="wrap">

function mon(d){d=new Date(d);d.setHours(12,0,0,0);d.setDate(d.getDate()-((d.getDay()+6)%7));return d}
function todayIdx(){return Math.min(4,(new Date().getDay()+6)%7)}
function iso(d){var x=new Date(d);return x.getFullYear()+'-'+('0'+(x.getMonth()+1)).slice(-2)+'-'+('0'+x.getDate()).slice(-2)}
function addD(d,n){var x=new Date(d);x.setDate(x.getDate()+n);return x}
function dayDate(i){return addD(st.w,i)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}

function empty(){return {done:{},sent:0,replies:0,calls:0,proposals:0,won:0,mins:0}}
function gd(m,date){return st.docs[iso(date)+'_'+MEMBERS[m].n]||empty()}
function rv(m,date){return st.rev[iso(date)+'_'+MEMBERS[m].n]||{score:0,note:''}}
function tasks(m,i){var h=MEMBERS[m].hod;return (h?HT:MT).concat([['x'+i,'Focus: '+(h?EX.hod:EX.mem)[i]]])}
function pc(m,date){var i=(date.getDay()+6)%7;if(i>4)return null;var t=tasks(m,i),d=gd(m,date);return Math.round(t.filter(function(x){return d.done[x[0]]}).length/t.length*100)}
function isFuture(date){return iso(date)>iso(new Date())}

function rate(a,b){return b?Math.round(a/b*100)+'%':'-'}
function col(p){return p>=100?'var(--ok)':p>=60?'var(--lb)':'var(--bad)'}
function fmt(d){return d.toLocaleDateString(undefined,{day:'numeric',month:'short'})}

function wkStats(m,w){var o={n:MEMBERS[m].n,comp:0,sent:0,mins:0,md:0,replies:0,calls:0,proposals:0,won:0,qs:0,qn:0,hit:0};
 for(var i=0;i<5;i++){var dt=addD(w,i),d=gd(m,dt),q=rv(m,dt).score;o.comp+=pc(m,dt);o.sent+=d.sent||0;o.replies+=d.replies||0;o.calls+=d.calls||0;o.proposals+=d.proposals||0;o.won+=d.won||0;if(d.mins>0){o.mins+=d.mins;o.md++}if(q){o.qs+=q;o.qn++}if((d.sent||0)>=15)o.hit++}
 o.comp=Math.round(o.comp/5);o.avgm=o.md?Math.round(o.mins/o.md):0;o.q=o.qn?Math.round(o.qs/o.qn*10)/10:0;o.eph=o.mins?Math.round(o.sent/(o.mins/60)*10)/10:0;return o}
function report(w){var r={w:w,mem:[0,1,2].map(function(m){return wkStats(m,w)}),t:{sent:0,replies:0,calls:0,proposals:0,won:0},comp:0,qs:0,qn:0};
